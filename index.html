<!DOCTYPE html>
<html>
<head>
  <title>TAYYIB CO. | Kind to Lips. True to You.</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TAYYIB CO. offers pure, ethical, and thoughtfully crafted beauty products.">

  <!-- Premium Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: linear-gradient(135deg, #f7f2f8, #eef6f9, #fffaf5);
      color: #2b2b2b;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo img {
      height: 50px;
    }

    nav a {
      margin: 0 12px;
      text-decoration: none;
      color: #333;
      font-weight: 400;
      transition: 0.3s;
    }

    nav a:hover {
      color: #a67c52;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 120px 20px 90px;
    }

    .hero h1 {
      font-family: "Playfair Display", serif;
      font-size: 48px;
      margin-bottom: 15px;
      font-weight: 500;
    }

    .hero p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 30px;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.4);
      color: #333;
      text-decoration: none;
      transition: 0.3s;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.9);
    }

    /* FEATURED */
    .featured {
      padding: 60px 20px 100px;
      text-align: center;
    }

    .featured h2 {
      font-family: "Playfair Display", serif;
      font-size: 32px;
      margin-bottom: 40px;
    }

    .grid {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .card {
      width: 260px;
      padding: 20px;
      border-radius: 20px;

      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.4);

      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
      transition: 0.4s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 70px rgba(0,0,0,0.12);
    }

    .card img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .card h3 {
      font-family: "Playfair Display", serif;
      margin: 8px 0 4px;
      font-size: 18px;
    }

    .card p {
      color: #666;
      font-size: 14px;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 30px;
      font-size: 14px;
      color: #666;
    }

    footer a {
      color: #333;
      text-decoration: none;
    }

    footer a:hover {
      color: #a67c52;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .hero h1 {
        font-size: 34px;
      }

      header {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <img src="images/logo.png" alt="TAYYIB CO. Logo">
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
    <a href="https://instagram.com/tayyibco.official" target="_blank">Instagram</a>
  </nav>
</header>

<section class="hero">
  <h1>Kind to Lips. True to You.</h1>
  <p>Luxury rooted in simplicity and intention.</p>
  <a href="products.html" class="btn">Shop Now</a>
</section>

<section class="featured">
  <h2>Featured Products</h2>

  <div class="grid">

    <div class="card">
      <img src="images/product1.jpg" alt="Timeless Red">
      <h3>Matte Bullet Lipstick</h3>
      <p>Timeless Red</p>
    </div>

    <div class="card">
      <img src="images/product2.jpg" alt="Bare Bliss">
      <h3>Matte Bullet Lipstick</h3>
      <p>Bare Bliss</p>
    </div>

  </div>
</section>

<footer>
  <p>2026 TAYYIB CO.</p>
  <a href="https://instagram.com/tayyibco.official" target="_blank">Instagram</a>
</footer>

</body>
</html>
