<!DOCTYPE html>
<html>
<head>
  <title>TAYYIB CO. | Kind to Lips. True to You.</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TAYYIB CO. offers pure, ethical, and thoughtfully crafted beauty products.">

  <!-- Premium Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: linear-gradient(135deg, #f7f2f8, #eef6f9, #fffaf5);
      color: #2b2b2b;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo img {
      height: 50px;
    }

    nav a {
      margin: 0 12px;
      text-decoration: none;
      color: #333;
      transition: 0.3s;
    }

    nav a:hover {
      color: #a67c52;
    }

    /* PAGE TITLE */
    .content {
      padding: 80px 20px;
      text-align: center;
    }

    .content h2 {
      font-family: "Playfair Display", serif;
      font-size: 36px;
      margin-bottom: 50px;
    }

    /* GRID */
    .grid {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    /* PRODUCT CARD */
    .card {
      width: 300px;
      padding: 22px;
      border-radius: 24px;

      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: 0 25px 60px rgba(0,0,0,0.08);

      transition: 0.4s ease;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 35px 80px rgba(0,0,0,0.12);
    }

    .card img {
      width: 100%;
      border-radius: 16px;
      margin-bottom: 14px;
    }

    .card h3 {
      font-family: "Playfair Display", serif;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 14px;
      color: #555;
      margin: 6px 0;
    }

    /* BUTTONS */
    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 18px;
      border-radius: 30px;

      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.4);

      text-decoration: none;
      color: #333;
      font-size: 14px;

      transition: 0.3s;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.9);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 30px;
      font-size: 14px;
      color: #666;
    }

    footer a {
      color: #333;
      text-decoration: none;
    }

    footer a:hover {
      color: #a67c52;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
      }

      .content h2 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
